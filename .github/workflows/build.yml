name: build

on:
  push:
  workflow_dispatch:

jobs:
  pi-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            make flex bison bc libssl-dev dosfstools mtools fdisk
          pip install ziglang   # musl build of the touchscreen app (~5x smaller)
      - name: Build SD card image
        run: ./pi/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-sdcard
          path: pi/out/littlelx-sdcard.img.gz
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-pi-update
          path: pi/out/littlelx-pi-update.zip

  mega-firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile
        run: |
          arduino-cli core install arduino:avr
          arduino-cli compile --fqbn arduino:avr:mega --output-dir out mega/littlelx_mega
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-mega-hex
          path: out/littlelx_mega.ino.hex

  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build littlelx.exe (command line) and littlelx-app.exe (tray app)
        run: |
          python -m pip install pyserial pyinstaller pyside6
          git describe --always --dirty > VERSION
          pyinstaller --onefile --console --name littlelx --add-data "ma3/littlelx.lua;ma3" --add-data "profiles;profiles" --add-data "VERSION;." bridge/littlelx.py
          pyinstaller --onefile --noconsole --name littlelx-app --add-data "ma3/littlelx.lua;ma3" --add-data "profiles;profiles" --add-data "VERSION;." bridge/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-windows
          path: |
            dist/littlelx.exe
            dist/littlelx-app.exe

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build littlelx.app (menu bar app)
        run: |
          python -m pip install pyserial pyinstaller pyside6
          git describe --always --dirty > VERSION
          pyinstaller --windowed --name littlelx --add-data "ma3/littlelx.lua:ma3" --add-data "profiles:profiles" --add-data "VERSION:." bridge/app.py
          # menu bar only: no Dock icon
          plutil -insert LSUIElement -bool true dist/littlelx.app/Contents/Info.plist
          ditto -c -k --keepParent dist/littlelx.app littlelx-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-mac
          path: littlelx-mac.zip

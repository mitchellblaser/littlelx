name: build

on:
  push:
  workflow_dispatch:

jobs:
  pi-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            make flex bison bc libssl-dev dosfstools mtools fdisk
          pip install ziglang   # musl build of the touchscreen app (~5x smaller)
      - name: Build SD card image
        run: ./pi/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-sdcard
          path: pi/out/littlelx-sdcard.img.gz
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-pi-update
          path: pi/out/littlelx-pi-update.zip

  mega-firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile
        run: |
          V=$(git describe --always --dirty)
          echo "#define LLX_VERSION \"$V\"" > mega/littlelx_mega/version.h   # reported in its HELLO
          arduino-cli core install arduino:avr
          arduino-cli compile --fqbn arduino:avr:mega --output-dir out mega/littlelx_mega
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-mega-hex
          path: out/littlelx_mega.ino.hex

  firmware-package:   # every part's firmware in one file, for the app's Install
    runs-on: ubuntu-24.04
    needs: [mega-firmware, pi-image]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: littlelx-mega-hex
          path: dl/mega
      - uses: actions/download-artifact@v4
        with:
          name: littlelx-pi-update
          path: dl/pi
      - name: Make littlelx-firmware.lxfw
        run: |
          V=$(git describe --always --dirty)
          python3 bridge/fwpack.py make littlelx-firmware.lxfw "$V" \
            --main dl/mega/littlelx_mega.ino.hex --main-version "$V" \
            --touchscreen dl/pi/littlelx-pi-update.zip
          python3 bridge/fwpack.py show littlelx-firmware.lxfw
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-firmware
          path: littlelx-firmware.lxfw

  windows-bridge:
    runs-on: windows-latest
    needs: firmware-package
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4   # the firmware package built from this commit, bundled
        with:
          name: littlelx-firmware
          path: firmware
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build littlelx.exe (command line) and littlelx-app.exe (tray app)
        run: |
          python -m pip install pyserial pyinstaller pyside6
          git describe --always --dirty > VERSION
          pyinstaller --onefile --console --name littlelx --paths bridge --hidden-import megaflash --hidden-import fwpack --add-data "ma3/littlelx.lua;ma3" --add-data "profiles;profiles" --add-data "firmware;firmware" --add-data "VERSION;." bridge/littlelx.py
          pyinstaller --onefile --noconsole --name littlelx-app --paths bridge --hidden-import megaflash --hidden-import fwpack --add-data "ma3/littlelx.lua;ma3" --add-data "profiles;profiles" --add-data "firmware;firmware" --add-data "VERSION;." bridge/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-windows
          path: |
            dist/littlelx.exe
            dist/littlelx-app.exe

  mac-app:
    runs-on: macos-latest
    needs: firmware-package
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4   # the firmware package built from this commit, bundled
        with:
          name: littlelx-firmware
          path: firmware
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build littlelx.app (menu bar app)
        run: |
          python -m pip install pyserial pyinstaller pyside6
          git describe --always --dirty > VERSION
          pyinstaller --windowed --name littlelx --paths bridge --hidden-import megaflash --hidden-import fwpack --add-data "ma3/littlelx.lua:ma3" --add-data "profiles:profiles" --add-data "firmware:firmware" --add-data "VERSION:." bridge/app.py
          # menu bar only: no Dock icon
          plutil -insert LSUIElement -bool true dist/littlelx.app/Contents/Info.plist
          # that edit breaks PyInstaller's signature, and macOS calls an app with a
          # broken signature "damaged": sign it again (ad hoc) and check
          codesign --force --deep --sign - dist/littlelx.app
          codesign --verify --deep --strict --verbose=2 dist/littlelx.app
          ditto -c -k --keepParent dist/littlelx.app littlelx-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: littlelx-mac
          path: littlelx-mac.zip
